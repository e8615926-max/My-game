<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1b36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>World Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232356a0'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%2372b848'/%3E%3Crect x='6' y='3' width='4' height='3' fill='%238b8b93'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="top">
  <button id="btnMenu" class="ibtn" aria-label="Menu">☰</button>
  <div id="info"><b id="wname">—</b><span id="wyear"></span></div>
  <button id="btnPop" class="stat"><span>👥</span><b id="spop">0</b></button>
  <button id="btnKd" class="stat"><span>🏰</span><b id="skd">0</b></button>
  <button id="btnHist" class="stat"><span>📜</span></button>
</div>
<div id="speeds" role="group">
  <button data-speed="0" aria-label="Pause">⏸</button>
  <button data-speed="1" aria-label="Normal">▶</button>
  <button data-speed="3" aria-label="Fast">▶▶</button>
  <button data-speed="10" aria-label="Ultra">▶▶▶</button>
</div>
<canvas id="minimap" width="150" height="112"></canvas>
<div id="toast"></div>

<div id="panel" hidden>
  <div id="panelHead"><button id="panelBack" class="ibtn" hidden>‹</button><b id="panelTitle"></b><button id="panelClose" class="ibtn" aria-label="Close">✕</button></div>
  <div id="panelBody"></div>
</div>

<div id="bottom">
  <div id="toolinfo">
    <div id="tooltext"><b id="toolname"></b><span id="tooldesc"></span></div>
    <label id="brushwrap"><span id="brushlabel"></span><input id="brush" type="range" min="0" max="8" step="1" value="2"><b id="brushval">2</b></label>
  </div>
  <div id="powers"></div>
  <div id="tabs"></div>
</div>
<input id="fileIn" type="file" accept=".json,application/json" hidden>

<script src="js/core.js"></script>
<script src="js/lang.js"></script>
<script src="js/world.js"></script>
<script src="js/units.js"></script>
<script src="js/civ.js"></script>
<script src="js/nature.js"></script>
<script src="js/powers.js"></script>
<script src="js/save.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
